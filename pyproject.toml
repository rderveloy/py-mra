[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-mra"
version = "0.1.0"
description = "Python implementation of the Match Rating Approach phonetic algorithm."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Robert Derveloy", email = "pymra.step200@aleeas.com" }]
keywords = ["phonetic", "match-rating-approach", "mra", "name-matching", "fuzzy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/py_mra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
